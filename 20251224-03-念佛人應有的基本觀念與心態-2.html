
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20251224-03-念佛人應有的基本觀念與心態-02</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Heiti TC", sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 導覽列設定 */
        .nav-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 10; }
        
        /* 上下一題按鈕 */
        .nav-btn { background: none; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; font-size: 1rem; cursor: pointer; color: #555; transition: all 0.2s; white-space: nowrap; }
        .nav-btn:active { background-color: #e0e0e0; transform: scale(0.95); }
        
        /* 中間區域容器 */
        .center-group { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* 首頁按鈕 */
        .home-btn { 
            display: inline-block; 
            text-decoration: none; 
            background-color: #8d6e63; 
            color: white; 
            padding: 10px 30px; 
            border-radius: 25px; 
            font-size: 1.1rem; 
            font-weight: bold;
            transition: background 0.3s, transform 0.2s; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }
        .home-btn:hover { background-color: #6d4c41; transform: translateY(-2px); }
        .home-btn:active { transform: translateY(0); }

        /* 進度文字 */
        #progress-indicator { font-size: 0.85rem; color: #888; white-space: nowrap; }
        
        /* 卡片容器 */
        .card-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; position: relative; }
        
        .card { background-color: #fff; width: 100%; max-width: 600px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-height: calc(100vh - 180px); overflow-y: auto; display: flex; flex-direction: column; }
        .content-text { margin: auto 0; padding: 40px; text-align: left; font-size: 1.6rem; line-height: 1.8; font-weight: normal; word-wrap: break-word; color: #333; }
        .mode-q .content-text { font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .control-bar { flex-shrink: 0; padding: 20px; background-color: #fff; border-top: 1px solid #ddd; display: flex; justify-content: center; }
        .toggle-btn { width: 100%; max-width: 400px; padding: 18px 0; border: none; border-radius: 12px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-show-answer { background-color: #27ae60; color: #fff; }
        .btn-show-question { background-color: #2c3e50; color: #fff; }
        .btn-locked { background-color: #ccc !important; color: #888 !important; cursor: not-allowed; box-shadow: none; }
        #status-msg { text-align: center; font-size: 0.8rem; color: #aaa; padding-bottom: 5px; background-color: #fff; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevCard()">❮ 上一題</button>
        <div class="center-group">
            <a href="https://namomt.github.io/pureland-study/" class="home-btn">回首頁</a>
            <span id="progress-indicator">1 / 1</span>
        </div>
        <button class="nav-btn" onclick="nextCard()">下一題 ❯</button>
    </div>
    
    <div class="card-container" id="touch-area">
        <div class="card mode-q" id="flashcard">
            <div class="content-text" id="card-content">載入中...</div>
        </div>
    </div>
    
    <div id="status-msg">檢查時間權限中...</div>
    <div class="control-bar">
        <button id="toggle-btn" class="toggle-btn btn-locked" onclick="toggleMode()">解答</button>
    </div>

<script>
    const quizData = [{"q": "根據慧淨法師的開示，念佛人求生極樂世界的目的是什麼？", "a": "是最高、究竟，而且是唯一的目的，其他效益皆為附帶。"}, {"q": "念佛帶來的消業障、增福慧等世間利益，為何被視為「附帶的」？", "a": "因為這些利益是無常且不究竟的，死後依然會六道輪迴。"}, {"q": "一位真正的念佛人，對往生極樂世界的心態應該是怎樣的？", "a": "由始至終，百分之百的堅定，不會中途退失、改變。"}, {"q": "文中所定義的「凡夫」內涵是什麼？", "a": "貪瞋痴具足、妄想雜念不斷，並且貪著五欲的塵勞。"}, {"q": "什麼是「博地凡夫」？", "a": "自覺自己的貪瞋痴煩惱比別人更熾盛，且無力靠自力修持戒定慧的凡夫。"}, {"q": "念佛法門是否要求行者必須先斷除五欲之心？", "a": "不是，阿彌陀佛正是為了無法靠自力斷除五欲的凡夫而建立此法門。"}, {"q": "即使平時對世間仍有貪著，為何這不會障礙往生？", "a": "因為阿彌陀佛本來就是要救度這樣的眾生，這正是我們需要求生淨土的原因。"}, {"q": "在臨命終時，念佛人面臨娑婆世界與極樂世界的選擇，必須做出什麼決定？", "a": "必須完全放下對世間的一切執著，選擇往生極樂世界。"}, {"q": "如果在臨終的緊要關頭仍然執著不放，這代表什麼？", "a": "代表平時說要往生極樂世界的心是假的，不是真的。"}, {"q": "為什麼人死後想永遠停留在陽世的家中或與子孫相伴是不可能的？", "a": "因為每個人都要隨自己的業報去投胎轉世，不可能永遠停留在中陰身狀態。"}, {"q": "往生極樂世界後，念佛人如何才能繼續照顧世間的眷屬？", "a": "往生後會擁有神通，可以回來探視並救度他們到極樂世界團圓。"}, {"q": "念佛人應如何看待今生所遭遇的成敗得失與苦樂禍福？", "a": "應相信這百分之百是過去生生世世自己所造的因果業報。"}, {"q": "一個念佛人面對逆境時，應秉持_____、_____、_____之心。", "a": "安分守己、隨遇而安、逆來順受"}, {"q": "若念佛人凡事不平不滿、嫉妒計較，這是因為不了解什麼道理？", "a": "不了解善惡報應、三世因果、自作自受的道理。"}, {"q": "面對他人不友善的對待時，為何不應「以牙還牙」？", "a": "因為這可能是償還過去所欠的債，以牙還牙會再造新業。"}, {"q": "一個念佛人的三個核心要點是什麼？", "a": "第一「隨緣消舊業，更莫造新殃」，第二專念南無阿彌陀佛，第三願生極樂世界。"}, {"q": "為何念佛人所做的善行，對於往生而言「沒有增減影響」？", "a": "因為往生是專靠「南無阿彌陀佛」這句萬德洪名，其功德已圓滿具足且超越六度萬行。"}, {"q": "念佛的方式有哪四種？", "a": "大聲念、小聲念、金剛念、心中默念。"}, {"q": "什麼是「金剛念」，以及為何平時鼓勵以此方式念佛？", "a": "指動嘴唇不出聲，自己聽得到。因其不累、不傷氣，可以長久持念。"}, {"q": "為何不特別鼓勵用心中默念的方式？", "a": "因為凡夫容易落入妄想雜念中而沒有察覺，動嘴唇有助於攝心。"}, {"q": "在走路、工作等不動腦筋的時候念佛，稱為什麼念佛？", "a": "散心念佛。"}, {"q": "在空閒的時候，一字一句清楚地念佛，稱為什麼念佛？", "a": "專心念佛。"}, {"q": "念佛人不應因為有在_____念佛，就忽略了利用空閒時間_____念佛。", "a": "散心；專心"}, {"q": "阿彌陀佛的第十八願中「乃至十念」的涵義，啟示我們應該如何念佛？", "a": "就是要我們隨順自己的時間和能力去念佛，一有時間就念佛。"}, {"q": "《地藏經》中描述眾生「舉止動念，無不是業，無不是罪」，對此念佛人應如何轉念？", "a": "應將妄想雜念轉來念「南無阿彌陀佛」，以正念消解雜念。"}, {"q": "當一個人對往生極樂世界的心很懇切時，會自然產生什麼行為？", "a": "他會自然而然地想要念佛，不需別人鼓勵鞭策。"}, {"q": "一個決定往生的人，其往生是在何時就確定的？", "a": "是在平生就已經決定下來了，稱為「平生業成」。"}, {"q": "經文「光明遍照十方世界，念佛眾生攝取不捨」給予念佛人什麼樣的保障？", "a": "念佛人從現在到臨終，都時刻在阿彌陀佛的光明攝取之中，絕不會被遺漏。"}, {"q": "為何念佛人即使在臨終病苦無法出聲念佛時，心中依然有大安心？", "a": "因為他了解佛心，知道時間一到，阿彌陀佛必定會來接引他。"}, {"q": "念佛人為人處世應秉持的兩句話、六個字原則是什麼？", "a": "「守大體、有分寸」。"}, {"q": "問答中提到，若念佛人臨終時未見佛來接引，這是什麼原因？", "a": "表示時候未到，只要時間到了，阿彌陀佛一定會現前。"}, {"q": "為什麼有些念佛人會擔心臨終時病痛纏身無法念佛，佛就不來接引？", "a": "因為他們對阿彌陀佛第十八願的本願救度道理不了解，對佛心不明瞭。"}, {"q": "平常念佛應以念六字還是四字為主？", "a": "以念「南無阿彌陀佛」六字為主。"}, {"q": "在什麼情況下可以改念四字「阿彌陀佛」佛號？", "a": "在臨睡時，或因病痛纏身無法念六字時。"}, {"q": "念四字佛號時，若愈念愈快以求攝心，可能隱含什麼樣的心態而不自知？", "a": "可能兼含有自力之心，而非完全依靠他力。"}, {"q": "祭祖時，淨土法門的行者應如何做，以取代燒紙錢的習俗？", "a": "誦一部《阿彌陀經》之後，稱念阿彌陀佛名號迴向即可。"}, {"q": "為什麼無法單從一個念佛人的外觀言行，判斷他臨終時是否一定會往生？", "a": "因為往生的關鍵在於內心的願生心與信心，而外在行為可能虛假。"}, {"q": "淨土法門被稱為「易行道」，其「易」有哪三個意涵？", "a": "簡易（簡單不複雜）、容易（不困難）、安易（輕鬆而安樂）。"}, {"q": "龍樹菩薩在《易行品》中將淨土法門比喻為什麼？", "a": "比喻為坐船，並說「乘船則樂」。"}, {"q": "在搭乘阿彌陀佛的「大願船」時，念佛人需要做什麼？", "a": "什麼都不用做，只要「安分守己」留在船上就好。"}, {"q": "所謂念佛人的「安分守己」是指什麼？", "a": "指「隨緣消舊業，更莫造新殃」，決定願生極樂，專念「南無阿彌陀佛」。"}];
    const TARGET_DATE = new Date("2026-03-03T19:00:00").getTime();

    let currentIndex = 0;
    let isShowingAnswer = false; 
    let isUnlocked = false;

    const cardEl = document.getElementById('flashcard');
    const contentEl = document.getElementById('card-content');
    const progressEl = document.getElementById('progress-indicator');
    const statusMsg = document.getElementById('status-msg');
    const toggleBtn = document.getElementById('toggle-btn');

    function checkTime() {
        const now = new Date().getTime();
        if (now >= TARGET_DATE) { enableUnlock(); } else { disableUnlock(); }
    }

    function enableUnlock() {
        if(isUnlocked) return;
        isUnlocked = true;
        statusMsg.textContent = "🔓 時間已到，可以查看解答。";
        updateButtonState();
    }

    function disableUnlock() {
        isUnlocked = false;
        if(isShowingAnswer) { isShowingAnswer = false; renderCard(); }
        
        const targetDate = new Date(TARGET_DATE);
        const dateStr = targetDate.toLocaleDateString('zh-TW', {year: 'numeric', month: '2-digit', day: '2-digit'});
        const timeStr = targetDate.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});

        statusMsg.textContent = `🔒 尚未到解鎖時間 (${dateStr} ${timeStr})，按鈕暫無功能。`;
        updateButtonState();
    }

    function renderCard() {
        const item = quizData[currentIndex];
        if (!isShowingAnswer) {
            contentEl.innerHTML = item.q;
            cardEl.className = "card mode-q";
        } else {
            contentEl.innerHTML = item.a;
            cardEl.className = "card mode-a";
        }
        cardEl.scrollTop = 0;
        progressEl.textContent = `${currentIndex + 1} / ${quizData.length}`;
        updateButtonState();
    }

    function updateButtonState() {
        if (!isUnlocked) {
            toggleBtn.textContent = "解答";
            toggleBtn.className = "toggle-btn btn-locked";
            return;
        }
        toggleBtn.classList.remove("btn-locked");
        if (isShowingAnswer) {
            toggleBtn.textContent = "題目"; 
            toggleBtn.className = "toggle-btn btn-show-question";
        } else {
            toggleBtn.textContent = "解答";
            toggleBtn.className = "toggle-btn btn-show-answer";
        }
    }

    function toggleMode() {
        if (!isUnlocked) return;
        isShowingAnswer = !isShowingAnswer;
        renderCard();
    }

    function nextCard() {
        if (currentIndex < quizData.length - 1) {
            currentIndex++;
            isShowingAnswer = false;
            renderCard();
        } else {
            alert("已經是最後一題囉！");
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            isShowingAnswer = false;
            renderCard();
        }
    }

    // --- 新增：手機觸控滑動支援 (Swipe Support) ---
    let touchStartX = 0;
    let touchEndX = 0;
    const minSwipeDistance = 50; // 滑動門檻值 (像素)，滑超過這個距離才算
    const touchArea = document.getElementById('touch-area');

    touchArea.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    touchArea.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        const distance = touchEndX - touchStartX;
        
        // 向左滑 (Swipe Left) -> 下一題 (距離為負)
        if (distance < -minSwipeDistance) {
            nextCard();
        }
        
        // 向右滑 (Swipe Right) -> 上一題 (距離為正)
        if (distance > minSwipeDistance) {
            prevCard();
        }
    }

    checkTime();
    renderCard();
    
    setInterval(checkTime, 60000);

    document.addEventListener('keydown', (e) => {
        if(e.key === "ArrowRight") nextCard();
        if(e.key === "ArrowLeft") prevCard();
    });
</script>
</body>
</html>
