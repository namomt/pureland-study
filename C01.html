<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提升自我無止境 - 問題閃卡</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
        :root {
            --primary-color: #5d4037;
            --secondary-color: #8d6e63;
            --background-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --font-size-base: 24px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: var(--font-size-base);
        }
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--background-color); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .lock-box {
            background: var(--card-bg); padding: 40px 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
            max-width: 400px; width: 90%;
        }
        .lock-box input {
            width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc;
            border-radius: 8px; font-size: 18px; box-sizing: border-box; text-align: center;
        }
        .lock-box button {
            width: 100%; padding: 12px; background: var(--primary-color);
            color: white; border: none; border-radius: 8px; font-size: 18px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .lock-box button:hover { background: var(--secondary-color); }
        
        #main-content { display: none; width: 100%; max-width: 800px; }
        .container { width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary-color); font-size: 1.5em; margin: 0 0 10px 0; }
        .progress-container {
            width: 100%; height: 10px; background-color: #e0e0e0;
            border-radius: 5px; margin-bottom: 20px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background-color: var(--primary-color);
            width: 0%; transition: width 0.3s ease;
        }
        .status-text { text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9em; }
        
        .flashcard {
            perspective: 1000px; width: 100%; min-height: 300px; cursor: pointer; margin-bottom: 30px;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d; min-height: 300px;
        }
        .flashcard.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; box-sizing: border-box; background-color: var(--card-bg);
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card-back {
            transform: rotateY(180deg); background-color: #fafafa; border: 2px solid var(--primary-color);
        }
        .card-content { font-size: 1.2em; line-height: 1.5; word-wrap: break-word; max-width: 100%; }
        .card-label {
            position: absolute; top: 15px; left: 20px; font-size: 0.7em;
            color: #999; text-transform: uppercase; letter-spacing: 1px;
        }
        
        .controls { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        button.ctrl-btn {
            padding: 12px 24px; font-size: 1em; background-color: var(--primary-color);
            color: white; border: none; border-radius: 8px; cursor: pointer;
            transition: background-color 0.2s; display: flex; align-items: center; gap: 8px;
        }
        button.ctrl-btn:hover { background-color: var(--secondary-color); }
        button.ctrl-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .top-controls {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .size-controls button, .speak-btn {
            background: none; border: 1px solid var(--primary-color); color: var(--primary-color);
            padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9em;
        }
        .size-controls button:hover, .speak-btn:hover {
            background-color: var(--primary-color); color: white;
        }
        @media (max-width: 600px) {
            :root { --font-size-base: 20px; }
            .controls { gap: 10px; }
            button.ctrl-btn { padding: 10px 15px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <div id="lock-screen">
        <div class="lock-box">
            <i class="fas fa-lock" style="font-size: 40px; color: #5d4037; margin-bottom: 20px;"></i>
            <h2 style="color: #333; margin-bottom: 10px;">內容已上鎖</h2>
            <p style="color: #666; font-size: 15px; margin-bottom: 20px;">
                公開時間：<strong id="display-unlock-time">2025/12/05 0:00</strong><br>
                時間未到前，請輸入密碼解鎖。
            </p>
            <input type="password" id="pwd-input" placeholder="請輸入密碼" onkeypress="handleEnter(event)">
            <button onclick="verifyPassword()">解鎖內容</button>
        </div>
    </div>

    <div id="main-content">
        <div class="container">
            <div class="top-controls">
                <a href="index.html" style="text-decoration: none; color: var(--primary-color); font-size: 0.9em;">
                    <i class="fas fa-arrow-left"></i> 回首頁
                </a>
                <div class="size-controls">
                    <button onclick="changeFontSize(-2)">A-</button>
                    <button onclick="changeFontSize(2)">A+</button>
                </div>
            </div>

            <div class="header">
                <h1>提升自我無止境</h1>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text" id="statusText">載入中...</div>

            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <span class="card-label">問題</span>
                        <button class="speak-btn" onclick="speakText(event, 'q')" style="position: absolute; top: 10px; right: 10px;">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <div class="card-content" id="questionText"></div>
                    </div>
                    <div class="card-back">
                        <span class="card-label">答案</span>
                        <button class="speak-btn" onclick="speakText(event, 'a')" style="position: absolute; top: 10px; right: 10px;">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <div class="card-content" id="answerText"></div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="prevBtn" onclick="prevCard()">
                    <i class="fas fa-chevron-left"></i> 上一題
                </button>
                <button class="ctrl-btn" onclick="randomCard()">
                    <i class="fas fa-random"></i> 隨機
                </button>
                <button class="ctrl-btn" id="nextBtn" onclick="nextCard()">
                    下一題 <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const correctPassword = "8854";
        const unlockTimeStr = "2025/12/05 0:00"; 
        
        function checkLock() {
            if (!unlockTimeStr) return unlock(); 
            
            const unlockDate = new Date(unlockTimeStr).getTime();
            const now = new Date().getTime();
            
            if (now >= unlockDate) {
                unlock(); 
            } else if (sessionStorage.getItem("unlocked_提升自我無止境") === "true") {
                unlock(); 
            }
        }

        function verifyPassword() {
            const input = document.getElementById("pwd-input").value;
            if (input === correctPassword || correctPassword === "") {
                sessionStorage.setItem("unlocked_提升自我無止境", "true");
                unlock();
            } else {
                alert("密碼錯誤，請重新輸入！");
                document.getElementById("pwd-input").value = "";
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') verifyPassword();
        }

        function unlock() {
            document.getElementById("lock-screen").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            initFlashcards(); 
        }

        const flashcards = [
{ q: `根據智隨法師的觀點，出家人應在哪兩大方面提升自我？`, a: `出家人不僅要在法義上深入，也要在事務上精通。` },
{ q: `如果出家人不聞窗外事，長期不與外界接觸，會產生什麼後果？`, a: `會變得不適應社會，弘法時講的內容無法引起他人興趣。` },
{ q: `文中指出，相較於社會的快速變化，佛門的變化有何特點？`, a: `佛門的變化很慢，因為其傳統、保守的特性。` },
{ q: `淨土法門的主要優勢是什麼？`, a: `能夠更好地利益眾生。` },
{ q: `文中指出的淨土法門主要弱點是什麼？`, a: `缺乏弘法人才，特別是在弘法的善巧方便與技能方面。` },
{ q: `在佛門中，「體」和「用」分別指什麼？`, a: `「體」是內在的根本，指法義、道德、修養；「用」是發揮作用，指弘法利生。` },
{ q: `文中用觀音菩薩的什麼特徵來比喻弘法時需要有多元的善巧方便？`, a: `千手千眼，比喻方便法門很多。` },
{ q: `根據文本，如果佛門中人再過五到十年還跟不上網絡與內容技術的發展，可能會面臨什麼結果？`, a: `基本上會被徹底淘汰。` },
{ q: `六祖大師所說的「佛法在世間，不離世間覺」揭示了佛法與世間的什麼關係？`, a: `佛法和世間是相融的，學佛不應脫離世間。` },
{ q: `文中引用了哪兩位菩薩作為進入世間度化眾生的例子？`, a: `地藏菩薩到地獄，以及觀音菩薩到人間應化三十二相。` },
{ q: `觀音菩薩「應以何身得度，即現何身」的行為體現了什麼弘法精神？`, a: `體現了以不同手段和身分來利益眾生的善巧方便。` },
{ q: `相對於利益眾生，淨土法門在哪一方面對修行者來說比較容易做到？`, a: `在自利方面比較容易，只要遇到此法門，生死大事就相對可以安心。` },
{ q: `為何說弘法利生不能只靠任何一個人，即使是古代祖師？`, a: `因為凡夫能力有限，弘法需要道場、護持以及整個團隊的共同合作。` },
{ q: `文中提到，真正的修行好壞應如何看待？`, a: `要看在做事過程中，個人的忍受能力、起心動念以及應對是否得體。` },
{ q: `將一件功德的事變成業障的事，可能是由哪些個人因素導致的？`, a: `個人的能力、發心、習性、心性不成熟等因素。` },
{ q: `文中如何描述出家這條道路的學習特質？`, a: `是一條沒有止境的求學之路，一生一世都要不斷提升自我。` },
{ q: `為什麼說懂得法義不一定就能做好弘法的事？`, a: `因為弘法還需要口才、人緣和他人的護持等其他能力。` },
{ q: `有些人講得不好卻到處有人請，這取決於什麼？`, a: `這取決於個人的福報與因緣。` },
{ q: `作者認為觀音菩薩是出家人的最好典範，這體現在哪方面？`, a: `體現在能做所有事、能吃所有苦，沒有固定模式，隨緣度眾。` },
{ q: `從個人往生的角度來看，做到_____就算成功了。`, a: `老實念佛，保證往生` },
{ q: `從團隊與弘法的角度來看，僅僅會念佛是否足夠？`, a: `不足夠，還需要具備弘法人才和良好的管理等多方面條件。` },
{ q: `一個寺院要產生大的影響力，除了弘法人才，還需要什麼重要條件？`, a: `需要有良好的管理，因為管理和弘法是相輔相成的。` },
{ q: `文中提到，建立團隊的正面影響力很難，但破壞它卻很容易，這是為什麼？`, a: `因為可能需要十個人付出很大代價來建立，但只要一個人在私下搞小動作就可能全部破壞掉。` },
{ q: `在做事當中出現問題時，應當從哪兩個方面及時反省？`, a: `反省是能力不夠，還是心性不及。` },
{ q: `「和合共住」對道場中的每個人有什麼樣的要求？`, a: `對每個人都有很高的要求，大家都需要有和合共住的觀念。` },
{ q: `在一個道場中，什麼因素被認為比其他任何方面都更重要？`, a: `道場的氛圍比什麼都重要。` },
{ q: `如果一個團隊的心性不好、氛圍不好，即使其他方面很好，會導致什麼結果？`, a: `將無法維持下去。` },
{ q: `「離世覓菩提，_____。」`, a: `恰如求兔角` },
{ q: `文中提到，做事時有些人能力足夠但卻不願意做或起煩惱，這是_____不夠的表現。`, a: `心性` },
{ q: `作者認為，學佛是一個方向和標桿，告訴我們學佛沒有_____。`, a: `固定模式` }
        ];

        let currentCard = 0;
        let isFlipped = false;
        let currentFontSize = 24;

        function initFlashcards() {
            if(flashcards.length > 0) updateCard();
        }

        function updateCard() {
            const card = flashcards[currentCard];
            document.getElementById('questionText').innerHTML = card.q.replace(/\n/g, '<br>');
            document.getElementById('answerText').innerHTML = card.a.replace(/\n/g, '<br>');
            document.getElementById('statusText').textContent = `第 ${currentCard + 1} 題，共 ${flashcards.length} 題`;
            
            const progress = ((currentCard + 1) / flashcards.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
            
            document.getElementById('prevBtn').disabled = currentCard === 0;
            document.getElementById('nextBtn').disabled = currentCard === flashcards.length - 1;
            
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentCard < flashcards.length - 1) {
                currentCard++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentCard > 0) {
                currentCard--;
                updateCard();
            }
        }

        function randomCard() {
            if (flashcards.length <= 1) return;
            let newCard;
            do {
                newCard = Math.floor(Math.random() * flashcards.length);
            } while (newCard === currentCard);
            currentCard = newCard;
            updateCard();
        }

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 16) currentFontSize = 16;
            if (currentFontSize > 40) currentFontSize = 40;
            document.documentElement.style.setProperty('--font-size-base', currentFontSize + 'px');
        }

        function speakText(event, side) {
            event.stopPropagation();
            const textHTML = flashcards[currentCard][side];
            const text = textHTML.replace(/<[^>]*>?/gm, ''); 
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音朗讀功能");
            }
        }

        document.addEventListener('DOMContentLoaded', checkLock);
    </script>
</body>
</html>
